name: LSF Pages artifact security owner
on:
  push:
    branches: [diag/upload-pages-security-owner-20261105]
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13
        with:
          persist-credentials: false
      - run: |
          mkdir -p target/pages-owner/site
          printf 'pages source repair verified\n' > target/pages-owner/site/index.html
      - id: pages
        name: Upload Pages artifact with candidate composite
        uses: ./
        with:
          name: lsf-pages-owner
          path: target/pages-owner/site
          retention-days: 1
      - name: Require an artifact ID
        env:
          ARTIFACT_ID: ${{ steps.pages.outputs.artifact_id }}
        run: test -n "$ARTIFACT_ID"
      - uses: KirilsTurkins/lsf-download-artifact@f073ba9e3801be93f933866d4c9a748e42157e5f
        with:
          name: lsf-pages-owner
          path: target/pages-owner/download
      - name: Verify uploaded Pages contents
        run: |
          tar -xOf target/pages-owner/download/artifact.tar ./index.html > target/pages-owner/restored.html
          cmp target/pages-owner/site/index.html target/pages-owner/restored.html
